name: zWGestures
options:
  bundleIdPrefix: io.github.zilongyang
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.6"
  groupSortPosition: top
  generateEmptyDirectories: true

packages: {}

settings:
  base:
    # 应用图标来自 zWGestures/Resources/Assets.xcassets（由 scripts/make-app-icon.swift 生成）。
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local-only distribution: App Sandbox off (global event taps + shell scripts require it),
    # hardened runtime off (no notarization).
    ENABLE_HARDENED_RUNTIME: NO
    # Xcode 16+ splits the app into a stub executable plus `zWGestures.debug.dylib` to speed up
    # previews. That layout complicates signing and stack traces for no benefit here, so the app
    # builds as a single executable.
    ENABLE_DEBUG_DYLIB: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Manual
    # Stable local self-signed identity (created by scripts/create-signing-cert.sh).
    # A stable designated requirement keeps the Accessibility grant across rebuilds;
    # ad-hoc signing would invalidate it on every build.
    CODE_SIGN_IDENTITY: "zWGestures Local Signing"
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  zWGestures:
    type: application
    platform: macOS
    sources:
      - path: zWGestures
        excludes:
          - "Resources/Info.plist"
          # 出厂默认手势包必须**保持目录结构**进 bundle，即
          # `Contents/Resources/Defaults/gestures.json`：XcodeGen 默认会把普通的 .json 资源平铺到
          # Resources 根目录。所以它单独用下面的 folder reference 引入，这里排除以免重复添加。
          # 目录是否真的是 folder reference，以 `xcodebuild build` 后的产物路径为准。
          - "Resources/Defaults"
      - path: zWGestures/Resources/Defaults
        type: folder
      # ZWGCore is a SwiftPM package so that `swift test` can exercise the testable logic
      # without an app host (see Makefile). Its sources are compiled directly into the app
      # target rather than linked as a package product: Xcode 26 fails to resolve a local
      # package product referenced from an XcodeGen-generated project
      # ("Missing package product 'ZWGCore'").
      - path: ZWGCore/Sources/ZWGCore
    info:
      path: zWGestures/Resources/Info.plist
      properties:
        CFBundleName: zWGestures
        CFBundleDisplayName: zWGestures
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        # 图标由 scripts/make-app-icon.swift 生成。
        #
        # 用 asset catalog（编译成 Assets.car）+ CFBundleIconName，而不是老的
        # CFBundleIconFile + 独立 .icns：macOS 26+ 的 AppKit 走 asset catalog，
        # 老形式在「关于」面板这类 AppKit 路径上会渲染成空白（Finder 走图标服务，两条路不同）。
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        # 界面目前仅中文（英文化排在 v0.2.0，见 docs/ROADMAP.md 的 v0.2.0 工作包）。
        # 这里不能声明 `en`：那会让系统把英文用户导向一个其实不存在的英文界面。
        CFBundleLocalizations: [zh-Hans]
        LSMinimumSystemVersion: "14.0"
        # Menu-bar-only agent app (no Dock icon).
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: zWGestures 需要通过 AppleScript / Shell 脚本控制其它应用来执行你配置的手势命令。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zilongyang.zwgestures
        PRODUCT_NAME: zWGestures
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  zWGestures:
    build:
      targets:
        zWGestures: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # Unit tests live in the `Core` SwiftPM package and run with `swift test`
      # (see README) because `xcodebuild test` needs a pseudo-terminal for the
      # host app launcher.
      targets: []
