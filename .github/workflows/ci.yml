name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs anywhere: the compatibility tests read a configuration committed under
  # ZWGCore/Tests/ZWGCoreTests/Fixtures, not the WGestures installation on the machine.
  core-tests:
    name: ZWGCore 单元测试
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: 工具链版本
        run: |
          swift --version
          xcodebuild -version

      # Source-level guard for the AppKit actor-isolation crash — see scripts/check-appkit-isolation.py
      # and the "开发约定" section of the README. `make test` runs it too; running it first makes a
      # violation show up as its own failed step instead of hiding inside the test log.
      - name: 源码守卫（AppKit 隔离）
        run: make lint

      - name: 单元测试
        run: make test

  # `make test` only compiles ZWGCore. The App target — UI, EventTap, Overlay — is not in that
  # package, so without this job nothing would ever compile it in CI.
  app-build:
    name: App target 编译
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: 安装 XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth; zWGestures.xcodeproj is committed but generated.
      # Regenerating here also catches a project.yml edit that was never regenerated locally.
      - name: 生成工程
        run: xcodegen generate

      # No certificate exists on a runner: signing is off, which is all a compile check needs.
      - name: 编译 App target
        run: |
          xcodebuild -project zWGestures.xcodeproj -scheme zWGestures \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      # The factory-default gesture pack must keep its directory structure inside the bundle.
      # XcodeGen flattens plain .json resources to Contents/Resources/ unless the directory is a
      # folder reference (see project.yml), so this is the check that catches a regression there —
      # and a bundle without the pack is an app that does nothing when you draw a gesture.
      #
      # 断言本体在 scripts/check-defaults-in-bundle.sh，因为 make-dist.sh 要查同一件事。它以前是
      # 两处拷贝，2026-10-06 CI 就是被「拷贝没跟上默认包改成分语言目录」搞红的 —— 别再把逻辑抄回来。
      # 条数与手势名不在这里查：ZWGCore 的 DefaultGesturePackTests 已经把名册钉死了。
      - name: 断言出厂默认手势包在产物里
        run: scripts/check-defaults-in-bundle.sh build/Build/Products/Debug/zWGestures.app

      # Compiling is not the same as working: this confirms the resource landed where
      # `ConfigController.bundledDefaultsDirectory` looks for it.
      - name: 展示产物结构
        run: find build/Build/Products/Debug/zWGestures.app/Contents/Resources -maxdepth 2 | sort
